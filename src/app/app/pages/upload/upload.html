<!--
  Subida de documentos: zona de selección (input file), mensajes de éxito/error
  y acciones. Valida el espacio libre antes de enviar; el backend revalida
  tamaño, cuota (413) y tipo por magic bytes.
-->
<section class="page-shell upload-page">
  <header class="page-header">
    <div>
      <div class="eyebrow">BIBLIOTECA PERSONAL</div>
      <h1>Subir archivos</h1>
      <p>Los archivos se guardan en el servidor y estarán disponibles en tu Biblioteca.</p>
    </div>
  </header>

  <label class="upload-zone" [class.uploading]="uploading()">
    <span class="upload-icon">↑</span>
    <strong>{{ selectedFile?.name || 'Selecciona un archivo' }}</strong>
    <small>PDF, DOC, DOCX, PPT, PPTX, XLS o XLSX · Máximo {{ formatSize(maxBytes) }}</small>
    <input #fileInput type="file" accept=".pdf,.doc,.docx,.ppt,.pptx,.xls,.xlsx" [disabled]="uploading()" (change)="onFileSelected($event)">
  </label>
  <p class="form-message" *ngIf="message()">{{ message() }}</p>
  <p class="form-error" *ngIf="error()" role="alert">{{ error() }}</p>
  <div class="upload-actions" *ngIf="selectedFile">
    <button type="button" class="upload-button" [disabled]="uploading()" (click)="upload()">{{ uploading() ? 'Guardando archivo…' : 'Guardar en mi biblioteca' }}</button>
    <a routerLink="/biblioteca">Ver biblioteca</a>
  </div>
  <a class="library-link" *ngIf="!selectedFile" routerLink="/biblioteca">← Ir a mi biblioteca</a>
</section>
